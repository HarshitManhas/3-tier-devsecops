# SonarQube Project Configuration
sonar.projectKey=devops-project-3tier
sonar.projectName=DevOps Project - 3 Tier Application
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=api/controllers,api/middleware,api/models,api/routes,api/app.js,client/src

# Test directories
sonar.tests=api/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/*.test.js,**/*.spec.js,**/dist/**
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage reports
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info

# Language
sonar.language=js
sonar.javascript.environments=node,browser

# Quality Gate
sonar.qualitygate.wait=true
