---
# Jenkins Slave / Build Agent Setup
# Installs all build tools the slave needs to execute pipeline stages
# Run AFTER jenkins-setup.yml has configured the master

- name: Configure Jenkins Slave (Build Agent)
  hosts: jenkins_slave
  become: true
  gather_facts: true

  vars:
    trivy_version:    "0.50.1"
    gitleaks_version: "8.18.2"
    kubectl_version:  "1.29.0"
    helm_version:     "3.14.3"
    nodejs_version:   "20"
    jenkins_home:     "/home/jenkins"

  tasks:
    # ── System Prerequisites ────────────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - unzip
          - jq
          - python3-pip
          - python3-boto3
          - openjdk-17-jre-headless   # Required for Jenkins agent.jar
        state: present

    # ── Create jenkins user (master SSH's into this user) ───────────
    - name: Create jenkins user
      user:
        name: jenkins
        home: "{{ jenkins_home }}"
        shell: /bin/bash
        create_home: true
        system: false

    - name: Create jenkins .ssh directory
      file:
        path: "{{ jenkins_home }}/.ssh"
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0700'

    - name: Create jenkins workspace directory
      file:
        path: "{{ jenkins_home }}/workspace"
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    # ── Docker ──────────────────────────────────────────────────────
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    # ── AWS CLI v2 ───────────────────────────────────────────────────
    - name: Download AWS CLI v2
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp/
        remote_src: true

    - name: Install AWS CLI
      command: /tmp/aws/install --update
      args:
        creates: /usr/local/bin/aws

    # ── kubectl ──────────────────────────────────────────────────────
    - name: Download kubectl {{ kubectl_version }}
      get_url:
        url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # ── Helm ─────────────────────────────────────────────────────────
    - name: Download Helm {{ helm_version }}
      get_url:
        url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz

    - name: Extract Helm
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install Helm binary
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: '0755'
        remote_src: true

    # ── Trivy ────────────────────────────────────────────────────────
    - name: Download Trivy {{ trivy_version }}
      get_url:
        url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.deb"
        dest: /tmp/trivy.deb

    - name: Install Trivy
      apt:
        deb: /tmp/trivy.deb
        state: present

    - name: Update Trivy vulnerability database
      command: trivy image --download-db-only
      become_user: jenkins
      ignore_errors: true

    # ── Gitleaks ─────────────────────────────────────────────────────
    - name: Download Gitleaks {{ gitleaks_version }}
      get_url:
        url: "https://github.com/gitleaks/gitleaks/releases/download/v{{ gitleaks_version }}/gitleaks_{{ gitleaks_version }}_linux_x64.tar.gz"
        dest: /tmp/gitleaks.tar.gz

    - name: Install Gitleaks
      unarchive:
        src: /tmp/gitleaks.tar.gz
        dest: /usr/local/bin/
        remote_src: true
        include:
          - gitleaks

    - name: Set Gitleaks permissions
      file:
        path: /usr/local/bin/gitleaks
        mode: '0755'

    # ── Node.js {{ nodejs_version }} ─────────────────────────────────
    - name: Add NodeSource repository
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -
      args:
        creates: /usr/bin/node

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: true

    # ── Git configuration for Jenkins ────────────────────────────────
    - name: Configure git safe directory
      git_config:
        name: safe.directory
        value: "*"
        scope: system

    # ── Verify all tools ─────────────────────────────────────────────
    - name: Verify all tool installations
      shell: |
        echo "=== Jenkins Slave Tool Versions ==="
        echo "Java:      $(java -version 2>&1 | head -1)"
        echo "Docker:    $(docker --version)"
        echo "AWS CLI:   $(aws --version)"
        echo "kubectl:   $(kubectl version --client --short 2>/dev/null || kubectl version --client)"
        echo "Helm:      $(helm version --short)"
        echo "Trivy:     $(trivy --version | head -1)"
        echo "Gitleaks:  $(gitleaks version)"
        echo "Node.js:   $(node --version)"
        echo "npm:       $(npm --version)"
        echo "Git:       $(git --version)"
      register: tool_output
      changed_when: false

    - name: Print tool versions
      debug:
        msg: "{{ tool_output.stdout_lines }}"

    - name: Slave configuration complete
      debug:
        msg: |
          ✅ Jenkins Slave configured successfully!
          Next: In Jenkins Master UI, add this node:
            Manage Jenkins → Nodes → New Node
            Name: build-slave
            Type: Permanent Agent
            Remote root: /home/jenkins
            Labels: build-slave docker-agent
            Launch method: Launch agents via SSH
            Host: {{ ansible_host }}
            Credentials: jenkins-slave-ssh
