# Installs ALL tools on Jenkins Master EC2
# Includes: Terraform + Ansible (so you can run infra from EC2, not Windows)
# Also installs: Docker, AWS CLI, kubectl, Helm, Trivy, Gitleaks, Node.js

- name: Install All Tools on Jenkins Master
  hosts: jenkins_master
  become: true
  gather_facts: true

  vars:
    terraform_version: "1.7.5"
    trivy_version:     "0.50.1"
    gitleaks_version:  "8.18.2"
    kubectl_version:   "1.29.0"
    helm_version:      "3.14.3"
    nodejs_version:    "20"

  tasks:
    # ── System Prerequisites ───────────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - unzip
          - zip
          - jq
          - wget
          - software-properties-common
          - python3-pip
          - python3-boto3
          - python3-botocore
        state: present

    # ── Terraform ──────────────────────────────────────────────────
    - name: Add HashiCorp GPG key
      apt_key:
        url: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: Add HashiCorp repository
      apt_repository:
        repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present
        filename: hashicorp

    - name: Install Terraform {{ terraform_version }}
      apt:
        name: "terraform={{ terraform_version }}-1"
        state: present
        update_cache: true

    - name: Verify Terraform
      command: terraform version
      register: tf_version
      changed_when: false

    - name: Print Terraform version
      debug:
        msg: "{{ tf_version.stdout }}"

    # ── Ansible ────────────────────────────────────────────────────
    - name: Add Ansible PPA
      apt_repository:
        repo: ppa:ansible/ansible
        state: present

    - name: Install Ansible
      apt:
        name: ansible
        state: present
        update_cache: true

    - name: Install Ansible AWS collections
      command: ansible-galaxy collection install amazon.aws community.aws
      become_user: ubuntu
      ignore_errors: true

    - name: Verify Ansible
      command: ansible --version
      register: ansible_version
      changed_when: false

    - name: Print Ansible version
      debug:
        msg: "{{ ansible_version.stdout_lines[0] }}"

    # ── Docker ─────────────────────────────────────────────────────
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    # ── AWS CLI v2 ─────────────────────────────────────────────────
    - name: Download AWS CLI v2
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp/
        remote_src: true

    - name: Install AWS CLI
      command: /tmp/aws/install --update
      args:
        creates: /usr/local/bin/aws

    # ── kubectl ────────────────────────────────────────────────────
    - name: Download kubectl {{ kubectl_version }}
      get_url:
        url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # ── Helm ───────────────────────────────────────────────────────
    - name: Download Helm {{ helm_version }}
      get_url:
        url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz
        mode: '0644'

    - name: Extract Helm
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install Helm
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: '0755'
        remote_src: true

    # ── Trivy ──────────────────────────────────────────────────────
    - name: Download Trivy {{ trivy_version }}
      get_url:
        url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.deb"
        dest: /tmp/trivy.deb
        mode: '0644'

    - name: Install Trivy
      apt:
        deb: /tmp/trivy.deb
        state: present

    # ── Gitleaks ───────────────────────────────────────────────────
    - name: Download Gitleaks {{ gitleaks_version }}
      get_url:
        url: "https://github.com/gitleaks/gitleaks/releases/download/v{{ gitleaks_version }}/gitleaks_{{ gitleaks_version }}_linux_x64.tar.gz"
        dest: /tmp/gitleaks.tar.gz
        mode: '0644'

    - name: Extract and install Gitleaks
      unarchive:
        src: /tmp/gitleaks.tar.gz
        dest: /usr/local/bin/
        remote_src: true
        include:
          - gitleaks

    - name: Set Gitleaks permissions
      file:
        path: /usr/local/bin/gitleaks
        mode: '0755'

    # ── Node.js {{ nodejs_version }} ──────────────────────────────
    - name: Add NodeSource repository
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -
      args:
        creates: /usr/bin/node

    - name: Install Node.js
      apt:
        name: nodejs
        state: present

    # ── Copy project SSH key for Ansible to reach slave ───────────
    - name: Create .ssh directory for ubuntu user
      file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0700'

    - name: Note about SSH key
      debug:
        msg: |
          ⚠️  MANUAL STEP NEEDED:
          Copy your .pem key to the master so Ansible can SSH into slave:
            scp -i your-key.pem your-key.pem ubuntu@{{ inventory_hostname }}:/home/ubuntu/.ssh/
            ssh ubuntu@{{ inventory_hostname }} "chmod 600 /home/ubuntu/.ssh/your-key.pem"

    # ── Verify ALL tools ──────────────────────────────────────────
    - name: Verify all tools installed
      shell: |
        echo "=============================="
        echo " Jenkins Master - Tool Versions"
        echo "=============================="
        echo "Terraform: $(terraform version | head -1)"
        echo "Ansible:   $(ansible --version | head -1)"
        echo "Docker:    $(docker --version)"
        echo "AWS CLI:   $(aws --version)"
        echo "kubectl:   $(kubectl version --client 2>/dev/null | head -1)"
        echo "Helm:      $(helm version --short)"
        echo "Trivy:     $(trivy --version | head -1)"
        echo "Gitleaks:  $(gitleaks version)"
        echo "Node.js:   $(node --version)"
        echo "npm:       $(npm --version)"
        echo "=============================="
      register: all_versions
      changed_when: false

    - name: Print all versions
      debug:
        msg: "{{ all_versions.stdout_lines }}"