---
# Ansible Inventory — 2 EC2 Setup
# Fill in IPs after: terraform output

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/your-key.pem
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_python_interpreter: /usr/bin/python3

  children:
    # EC2 1 — Jenkins Server
    jenkins:
      hosts:
        jenkins-server:
          ansible_host: "REPLACE_WITH_JENKINS_IP"   # terraform output jenkins_ip

    # EC2 2 — SonarQube Server
    sonarqube:
      hosts:
        sonarqube-server:
          ansible_host: "REPLACE_WITH_SONARQUBE_IP" # terraform output sonarqube_ip