# DevOps Project - Local Development Stack
# Usage: cp api/.env.example api/.env && docker-compose up -d
version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: devops-project-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: crud_app
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD:-appsecret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./api/models/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: devops-project-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DB_HOST: mysql
      NODE_ENV: development
    ports:
      - "5000:5000"
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: devops-project-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
