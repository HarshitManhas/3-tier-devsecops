# ExternalSecretsOperator - pulls secrets from AWS Secrets Manager
# Requires: helm install external-secrets external-secrets/external-secrets -n external-secrets-system
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: backend-sa
            namespace: devops-project
---
# DB Credentials from Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: devops-project
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: devops-project-prod/rds/credentials
        property: host
    - secretKey: port
      remoteRef:
        key: devops-project-prod/rds/credentials
        property: port
    - secretKey: dbname
      remoteRef:
        key: devops-project-prod/rds/credentials
        property: dbname
    - secretKey: username
      remoteRef:
        key: devops-project-prod/rds/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: devops-project-prod/rds/credentials
        property: password
---
# App Secrets (JWT, Admin credentials)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: devops-project
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: devops-project-prod/app/secrets
        property: jwt_secret
    - secretKey: admin_email
      remoteRef:
        key: devops-project-prod/app/secrets
        property: admin_email
    - secretKey: admin_password
      remoteRef:
        key: devops-project-prod/app/secrets
        property: admin_password